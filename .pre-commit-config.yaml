repos:
  - repo: local
    hooks:
      - id: issue-trigger-post-merge
        name: issue-trigger reinstall after git pull
        entry: bash scripts/post-merge-hook.sh
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: issue-trigger-bash-syntax
        name: bash syntax check
        entry: bash -n
        language: system
        types: [shell]
        stages: [pre-commit]

      - id: issue-trigger-node-syntax
        name: node syntax check (mjs)
        entry: node --check
        language: system
        files: '\.mjs$'
        stages: [pre-commit]